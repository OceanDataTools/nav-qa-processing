  "$PASHR,ATT,255473.0,091.95,+001.15,-000.77,0.0034,0.0454,0*2E",
  "$GPGGA,225737.00,3408.8635,N,11912.5066,W,1,08,01.2,-00003,M,,M,,*65",
  "$GPVTG,173.91,T,,,000.06,N,000.11,K*16",
]

