id = "nav22"
title = "Raw NMEA: GGA with no date (dated by the file name)"
system = "Raw receiver output"
file_type = "ASCII text, one NMEA sentence per line"
vessels = ["Roger Revelle", "New Horizon"]
sentences = ["GGA", "VTG", "PASHR"]
position = "GGA"
time = "GGA time of day, dated by the YYYYMMDDHHmmss stamp in the file name"
description = "PASHR ATT, GGA and VTG sentences repeat in turn. No sentence carries a date: it comes from the YYYYMMDDHHmmss timestamp in the file name."
notes = [
  "Seen in New Horizon's Ashtech ADU2 fileset NH1209 (fileset 107219, files ashtech_YYYYMMDDhhmmss.raw). A file's name can postdate its first fix: ashtech_20120924000000.raw starts 2012-09-23 18:36.",
  "R2R files these filesets under 100010 (nav01's ID) and has made no products or QA from them.",
]
reader = [
  "A file's first GGA takes the date that puts it nearest the YYYYMMDDhhmmss stamp in the file's name; each GGA after it the date nearest the fix before (within 12 hours), so a file that runs past midnight moves to the next day there.",
  "A file without a stamp in its name can't be dated and is reported unread; a GGA without a parseable time is skipped.",
  "NavManager gives every GGA of a file its name's date, taking the stamp after the first _ of the whole path (R13).",
]
filesets = [
  "NH1209 (fileset 107219, New Horizon's Ashtech ADU2): R2R made no products from it; its fixes lie within meters of R2R's primary-GPS bestres at the same times. One file named 09-24 holds 09-23's fixes (R13).",
]
references = ["www.nmea.org"]
examples_from = "NH1209, fileset 107219, file ashtech_20120918225733.raw (Ashtech ADU2)"
examples = [
  "$PASHR,ATT,255472.0,091.94,+001.50,-001.77,0.0032,0.0412,0*2A",
