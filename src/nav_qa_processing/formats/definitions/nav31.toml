id = "nav31"
title = "UHDAS: GGA with PYRTM clock sentences"
system = "University of Hawaii Data Acquisition System (UHDAS)"
file_type = "ASCII text, one sentence per line"
vessels = ["Blue Heron", "Robert Gordon Sproul"]
sentences = ["PYRTM", "GGA"]
r2r_formats = [100234]
position = "GGA"
time = "GGA time of day, dated by the PYRTM year and day of year"
description = "When GPS isn't logged on its own, the GPS feed recorded by UHDAS is the only source. Each GGA is paired with a PYRTM sentence from the UHDAS computer's clock, which carries the year."
notes = [
  "The decimal day counts from 0 at January 1 00:00 UTC, as UNIXD's does: 275.83 of 2019 is October 3, 20:00. Current UHDAS installations write PYRTM beside every GPS feed (SP2613's UHDAS ADCP fileset 169848: gp170a, gp170b).",
  "R2R format 100234 is matched to this ID by layout; R2R's format page doesn't cite a NavManager document for it.",
]
reader = [
  "Each GGA takes the date that puts it nearest the PYRTM before it (the one after it, before the first), counting across midnight.",
  "The time of the fix is the GGA's: the UHDAS clock can run minutes off the receiver (BH19-30: about 4 minutes ahead).",
  "NavManager reads PYRTM only on its pyrtm_parser branch.",
]
filesets = [
  "BH19-30 (fileset 136141, Blue Heron's Furuno GP-90 through UHDAS; committed in tests/data/): 9,097 records equal to R2R's; G.",
  "SP2613 (UHDAS ADCP fileset 169848): UHDAS's GP170 feeds; every fix at R2R's bestres times, 5.5–7 m from the BX992.",
]
references = ["www.nmea.org"]
examples_from = "BH19-30, fileset 136141, file bh2019_275_72000.gps (Furuno GP-90)"
examples = [
  "$PYRTM,2019,275.8333405,75.8928819",
  "$GPGGA,195550,4648.9699,N,09158.8461,W,1,9,1.6,196,M,,M,,*62",
  "$PYRTM,2019,275.8333533,75.8928947",
  "$GPGGA,195551,4648.9697,N,09158.8462,W,1,8,1.6,196,M,,M,,*6F",
  "$PYRTM,2019,275.8333649,75.8929063",
  "$GPGGA,195552,4648.9693,N,09158.8465,W,1,8,1.6,196,M,,M,,*6F",
]

[[fields]]
name = "sentence"
example = "$GPGGA,…"
meaning = "NMEA 0183 sentence, with no prefix"
