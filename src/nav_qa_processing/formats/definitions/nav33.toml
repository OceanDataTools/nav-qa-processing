id = "nav33"
title = "SOI logger: ISO timestamp and a comma, then GGA"
system = "Schmidt Ocean Institute logger"
file_type = "ASCII text: ISO 8601 timestamp, comma, NMEA sentence"
vessels = ["Falkor (too)"]
sentences = ["GGA"]
r2r_formats = [100199]
position = "GGA"
time = "GGA time of day, dated by the logger's ISO timestamp"
description = "Each line is an ISO 8601 UTC timestamp with microseconds, a comma and a GGA sentence. The date comes from the timestamp."
notes = [
  "OpenRVDAS writes the same layout: OpenVDM's sample cruise (openvdm_sample_data, OpenRVDAS/raw/POSMV_GGA-*.txt) is read as nav33.",
  "Falkor (too)'s files start with a CSV header line (Timestamp,Header,GPSTime,…), which has no sentence and is skipped.",
  "R2R format 100199 (\"Applanix POSMV Raw Format FKt\") is this layout.",
]
reader = [
  "Each GGA takes the date that puts it nearest its line's ISO timestamp, counting across midnight. The time of the fix is the GGA's own, not the logger's.",
  "A sentence split across lines is joined with the following lines until its checksum is complete (register R5). Skipped and counted per file: a GGA without a parseable time, and one on a line without a logger timestamp.",
  "A line without a sentence, such as Falkor (too)'s CSV header, is ignored.",
  "Every fix is kept. NavManager drops the 86,400th fix of each buffer (R8), the cruise's last fix (R9), the earlier of two GGAs with the same time of day (R10), and the GGAs whose checksum is 0A–0F (R1).",
]
filesets = [
  "FKt230417 (fileset 157454, Falkor (too)'s Applanix POS/MV): G for both. R2R lacks the GGAs with checksums 0A–0F (2.9 %, R1), every 86,400th fix (R8) and the last (R9); QC flags 283 fixes 650 m off for 4.7 minutes (Q8).",
]
references = ["www.nmea.org"]
examples_from = "FKt230417, fileset 157454, file FKt230417_posmv_gga-2023-04-28.txt"
examples = [
  "2023-04-04T00:00:00.916471Z,$GPGGA,000000.839,2030.86487,N,04538.19146,W,5,32,0.6,0.54,M,,,4,1015*19",
  "2023-04-28T00:00:00.145798Z,$GPGGA,000000.016,1750.75553,N,06542.08544,W,5,35,0.8,-0.17,M,,,4,1015*30",
  "2012-04-28T00:00:01.109000Z,$GPGGA,000000.987,2635.03241,N,09331.21859,W,2,09,1.1,1.89,M,,,9,0025*16",
]

[[fields]]
name = "timestamp"
example = "2023-03-03T00:00:09.769028Z"
meaning = "Logger time, ISO 8601 UTC"

[[fields]]
name = "sentence"
example = "$GPGGA,…"
meaning = "NMEA GGA sentence"
