[[fields]]
name = "Date"
example = "06-03-2008"
meaning = "Logger date (MM-DD-YYYY)"

[[fields]]
name = "Time"
example = "19:59:59"
meaning = "Logger time (hh:mm:ss)"

[[fields]]
name = "GPS-TrimbleDiff-UTCofFix"
example = "200000.0"
meaning = "Trimble time of fix (hhmmss.s)"

[[fields]]
name = "GPS-TrimbleDiff-Latitude"
example = "41.49219"
meaning = "Latitude [degrees_north]"

[[fields]]
name = "GPS-TrimbleDiff-Longitude"
example = "-71.41862"
meaning = "Longitude [degrees_east]"

[[fields]]
name = "GPS-TrimbleDiff-Quality"
example = "2"
meaning = "NMEA GGA fix quality"

[[fields]]
name = "GPS-TrimbleDiff-SatsInUse"
example = "08"
meaning = "Satellites in use"

[[fields]]
name = "GPS-TrimbleDiff-HDOP"
example = "1.0"
meaning = "Horizontal dilution of precision"

[[fields]]
name = "GPS-TrimbleDiff-DiffAge"
example = "6.2"
meaning = "Age of differential corrections [s]"

[[fields]]
name = "…"
example = ""
meaning = "Course and speed made good, a second GPS (Northstar WAAS), meteorology and underway science"
