id = "nav10"
title = "UW DAS: multiplexed underway records"
system = "University of Washington data acquisition system"
file_type = "ASCII text, comma-separated"
vessels = ["Thomas G. Thompson"]
r2r_formats = [100019]
position = "Decimal degrees from the navigation computer"
time = "Navigation computer date and time, UTC"
description = "One record every 5 s combining the navigation computer's time and position with gyro, speed log, thermosalinograph, meteorology and winch values."
notes = [
  "During 2011 the date changed from DD/MM/YYYY to DD-MM-YYYY.",
]
examples = [
  "29-04-2011,00:00:00,+47.851067,-122.479765,167.1,167.2,41.2,13.0,8.483,8.337,3.0692,28.737,0.040,3.883,0187.7,07.2,,1016.2,0690.0,2359.8,07.5,191.6,20.0,010.9,07.8,191.0,1476.6,02,000.0,0000.0,00159.9",
  "29-04-2011,00:00:05,+47.850715,-122.479648,167.0,167.0,05.3,13.0,8.483,8.322,3.0694,28.740,0.040,3.885,0187.1,07.2,,1016.2,0689.0,2359.8,06.7,196.2,19.0,011.8,07.7,191.2,1476.6,02,000.0,0000.0,00159.9",
]

