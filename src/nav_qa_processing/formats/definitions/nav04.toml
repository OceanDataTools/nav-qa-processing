id = "nav4"
title = "WHOI Calliope: GPS records with several NMEA sentences per line"
system = "WHOI Calliope data acquisition system"
file_type = "ASCII text: tab-separated prefix, then comma-joined NMEA sentences"
vessels = ["Atlantis", "Knorr"]
sentences = ["ZDA", "GLL", "GGA", "RMC", "VTG"]
position = "GGA"
time = "GGA time of day, dated by ZDA"
description = "Calliope logs many instruments in one file. Navigation lines start with the tag GPS, then a numeric field, the logger time (hh:mm:ss), and several NMEA sentences joined by commas: either ZDA, GLL and GGA, or RMC, VTG and ZDA."
notes = [
  "The number after the tag looks like a spreadsheet-style day number; its meaning isn't documented.",
]
references = ["www.nmea.org"]
examples = [
  "GPS       \t39440.00013\t00:00:11\t$GPZDA,000010.00,24,12,2007,00,00*67,$GPGLL,1903.337259,N,10418.834213,W,000010.00,A,D*7E,$GPGGA,000010.00,1903.337259,N,10418.834213,W,2,11,0.9,26.664,M,-21.264,M,10.0,0011*75",
  "GPS       \t39440.00083\t00:01:11\t$GPRMC,000110.00,A,1903.337108,N,10418.834224,W,0.07,298.6,241207,0,E,D*0E,$GPVTG,298.6,T,,M,0.07,N,0.13,K,D*08,$GPZDA,000111.00,24,12,2007,00,00*67",
]

[[fields]]
name = "tag"
example = "GPS"
meaning = "Record type: navigation"

[[fields]]
name = "number"
example = "39440.00083"
meaning = "Undocumented numeric field"

[[fields]]
name = "time"
example = "00:01:11"
meaning = "Logger time, UTC (hh:mm:ss)"

[[fields]]
name = "sentences"
example = "$GPRMC,…,$GPVTG,…,$GPZDA,…"
meaning = "NMEA sentences joined by commas"
