example = "-99"
meaning = "Salinity [PSU] (uncertain)"

[[fields]]
name = "fluorometer"
example = "1.914"
meaning = "Fluorometer, raw"

[[fields]]
name = "keel_depth"
example = ""
meaning = "Keel depth [m] (uncertain)"

[[fields]]
