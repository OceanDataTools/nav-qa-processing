[PSXN]
title = "Kongsberg Seapath proprietary: quality and attitude"
notes = [
  "PSXN,20 gives three quality codes (horizontal position and velocity; height and vertical velocity; roll and pitch): 0 normal, 1 reduced, 2 invalid.",
  "PSXN,23 gives roll (port up positive), pitch (bow up positive), true heading [degree] and heave (down positive) [m].",
]
examples = ["$PSXN,20,0,0,0,0*3B", "$PSXN,23,0.05,0.05,89.40,0.00*0D"]

[PASHR]
