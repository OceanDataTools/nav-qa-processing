[GGA]
title = "Global positioning system fix data"
description = "Time of fix, position, fix quality, satellites, HDOP and altitude. The only common sentence that reports altitude."
notes = [
  "Fix quality: 0 invalid; 1 GPS (SPS); 2 differential; 3 PPS; 4 RTK fixed; 5 RTK float; 6 dead reckoning; 7 manual input; 8 simulator.",
  "Without a geoid height the altitude is suspect: some receivers report it above the ellipsoid, and some never report negative altitudes.",
]
examples = ["$GPGGA,123519,4807.038,N,01131.000,E,1,08,0.9,545.4,M,46.9,M,,*47"]
[[GGA.fields]]
name = "time"
example = "123519"
meaning = "UTC time of fix (hhmmss[.s…])"
[[GGA.fields]]
name = "lat"
example = "4807.038,N"
meaning = "Latitude, ddmm.m… and N/S"
[[GGA.fields]]
name = "lon"
example = "01131.000,E"
meaning = "Longitude, dddmm.m… and E/W"
[[GGA.fields]]
name = "quality"
example = "1"
meaning = "Fix quality (see notes)"
[[GGA.fields]]
name = "nsat"
example = "08"
meaning = "Satellites in use"
[[GGA.fields]]
name = "hdop"
example = "0.9"
meaning = "Horizontal dilution of precision"
[[GGA.fields]]
name = "alt"
example = "545.4,M"
meaning = "Antenna altitude above mean sea level [m]"
[[GGA.fields]]
name = "geoid"
example = "46.9,M"
meaning = "Geoid height above the WGS-84 ellipsoid [m]"
[[GGA.fields]]
name = "dgps_age"
example = ""
meaning = "Seconds since the last differential update"
[[GGA.fields]]
name = "dgps_station"
example = ""
meaning = "Differential reference station ID"

