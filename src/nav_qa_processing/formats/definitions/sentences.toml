meaning = "Longitude, dddmm.m… and E/W"
[[GLL.fields]]
name = "time"
example = "140844.00"
meaning = "UTC time of fix"
[[GLL.fields]]
name = "status"
example = "A"
meaning = "A valid, V invalid"

