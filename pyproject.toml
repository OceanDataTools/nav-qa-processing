[project]
name = "nav-qa-processing"
version = "0.1.0"
description = "R2R navigation standard products and quality assessment reports (PDF, Jupyter notebook, R2R QA 2.0 XML) for research-vessel GPS data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
  "cartopy>=0.24",
  "matplotlib>=3.9",
  "nbformat>=5.10",
  "numpy >= 2.0",
  "pandas >= 2.2.2",
  "pyproj >= 3.6",
  "reportlab>=4.2",
  "shapely >= 2.0",
  "svglib>=1.5",
]

[project.optional-dependencies]
# The OpenVDM hook reads openvdm.yaml
openvdm = ["pyyaml>=6.0"]

[project.scripts]
nav-qa-processing = "nav_qa_processing.cli:main"

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "nbclient>=0.10",
  "pypdf>=5.0",
  "pytest >= 8.3",
  "pyyaml >= 6.0",  # the openvdm extra, for its tests
  "ruff >= 0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
